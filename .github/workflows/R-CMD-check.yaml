name: R-CMD-check

on:
  pull_request:
    branches: [main]

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # backend must be an action INPUT, not `env: BACKEND:` -- the action
      # runs `export BACKEND=${{ inputs.backend }}` before calling run.sh, so a
      # workflow-level env is silently overwritten and CI stays green while
      # still using bspm. Confirm via "Selecting 'rapt'" in the Ubuntu log.
      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Dependencies
        run: ./run.sh install_all

      # NOTE: CI checks out a clean tree, so this job can never see untracked
      # scratch in a working tree -- that is what the mandatory LOCAL run of
      # the same script catches. What CI adds is the allowlist drifting out of
      # date, and GNU/BSD portability, which is why both matrix legs run it
      # rather than just Linux.
      - name: Validate tarball contents
        run: bash tools/check_tarball.sh

      - name: Validator self-test (negative cases)
        run: bash tools/check_tarball_selftest.sh

      - name: Test
        run: ./run.sh run_tests
